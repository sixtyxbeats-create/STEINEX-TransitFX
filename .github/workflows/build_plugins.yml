name: Build VST3 & AU Plugins

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_name: "SteinexTransitFX_VST3"
          - os: macos-latest
            target_name: "SteinexTransitFX_AU"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure and Build
        run: |
          cmake -B build
          cmake --build build --config Release --target ${{ matrix.target_name }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: STEINEX-TRANSIT-FX-${{ runner.os }}
          path: |
            build/_deps/juce-build/VST3/Release/TRANSIT FX.vst3
            build/_deps/juce-build/AU/Release/TRANSIT FX.component
