name: Build VST3 & AU Plugins

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_name: "SteinexTransitFX_VST3"
          - os: macos-latest
            target_name: "SteinexTransitFX_AU"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: cmake -B build -G "Xcode"

      - name: Build Project (Release)
        run: cmake --build build --config Release --target ${{ matrix.target_name }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: STEINEX-TRANSIT-FX-${{ runner.os }}
          path: |
            build/_deps/juce-build/VST3/Release/TRANSIT FX.vst3
            build/_deps/juce-build/AU/Release/TRANSIT FX.component
